server:
  port: 7011
spring:
  application:
    name: ainative-v2
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:2891}/${DB_NAME:ainative_v2}?useSSL=false&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
ainative:
  jwt-secret: ${AINATIVE_JWT_SECRET:}
  jwt-ttl-seconds: 7200
  public-base-url: ${AINATIVE_PUBLIC_BASE_URL_V2:http://localhost:7011}
  download-secret: ${AINATIVE_DOWNLOAD_SECRET:v2-download-secret}
  # 执行器安装源(决定「启动命令」里怎么装运行时):
  #   release(默认)= pip 装 GitHub Release wheel —— 要求仓库已公开,否则匿名下载 404
  #   npm           = npx -y ymai-codeflow@<version> —— 要求 npm 上有该版本
  #   local         = 运行时已在 PATH,命令只给 connect
  runtime-source: ${AINATIVE_RUNTIME_SOURCE:release}
  runtime-install-prefix: ${AINATIVE_RUNTIME_INSTALL_PREFIX:}
  # 外部平台凭据加密主密钥(Base64,解码后 32 字节)—— TAPD API 密钥密文存放。
  # 与 v1 同一约定(v1 也是 AINATIVE_SECRET_MASTER_KEY);不配时平台照常启动,
  # 只有真正要存取 TAPD 凭据时才报错。
  security:
    secret-crypto:
      master-key: ${AINATIVE_SECRET_MASTER_KEY:}
logging:
  level:
    com.ainative.v2: INFO
